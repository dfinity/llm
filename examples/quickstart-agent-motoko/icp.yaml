# yaml-language-server: $schema=https://github.com/dfinity/icp-cli/raw/refs/tags/v1.3.0/docs/schemas/icp-yaml-schema.json

canisters:
  - name: llm
    build:
      steps:
        - type: pre-built
          url: https://github.com/dfinity/llm/releases/download/v1.2.0/llm-canister.wasm
          sha256: 2e12fcfc005e0e586dd43a74826c2e4b9f810156cf9aeb18c7bd687e352a63f7
    init_args: '(opt variant { https = record {} })'
    settings:
      # The canister authenticates its HTTPS outcalls to the Internet
      # Intelligence Gateway with this API key. It's read from the
      # gitignored `.secrets/iig-api-key` file so the secret stays out of
      # committed config. See the README's "Getting an API key".
      environment_variables:
        IIG_API_KEY:
          path: ./.secrets/iig-api-key

  - name: agent
    recipe:
      type: "@dfinity/motoko@v4.1.0"
      configuration:
        main: src/main.mo

networks:
  - name: local
    mode: managed
    gateway:
      bind: 0.0.0.0
      port: 8080

environments:
  - name: ic
    network: ic
    canisters:
      - agent
